# 靜態站：根目錄即網站根
# command = 部署閘門：驗證失敗 → 部署失敗 → 線上維持上一版（2026-07-19 白屏事故後加）
[build]
  publish = "."
  command = "node scripts/validate-deploy.mjs"

# Service Worker 勿長期快取在 CDN（更新才會生效）
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
