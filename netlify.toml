# 靜態站：根目錄即網站根
# command = 部署閘門：驗證失敗 → 部署失敗 → 線上維持上一版（2026-07-19 白屏事故後加）
# ignore = 止血（2026-07-20）：斷開雲端 auto-build（每次 push 都 build 會燒點數）。
#   發佈一律走本機驗證+direct upload：node scripts/validate-deploy.mjs && netlify deploy --prod --dir . --site <id>
#   （站台層另設 stop_builds=true 為主閘;本 ignore 為備援:exit 0 → 一律略過雲端 build）
[build]
  publish = "."
  command = "node scripts/validate-deploy.mjs --selftest"
  ignore = "exit 0"

# Service Worker 勿長期快取在 CDN（更新才會生效）
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 🔒 v105(2026-11-13):publish="." 會把整個 repo 根目錄發出去 ⇒ 內部文件、腳本、測試一律回 404。
#   網站真正用到的只有 / sw.js manifest.webmanifest icons/ vendor/ data/,這幾個不能擋。
#   中文檔名兩種寫法都列(原字與 URL 編碼),部署後兩種都 curl 看內容驗。新增內部檔案記得補一條。
[[redirects]]
